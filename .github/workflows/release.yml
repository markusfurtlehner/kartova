name: Release

# Tagging v1.2.3 builds every platform and publishes them on the release.
# Also runnable by hand, which produces the artifacts without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # The scanner touches platform filesystem behaviour directly, so a release is
        # gated on all three agreeing rather than on the build machine alone.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test -c Release --verbosity normal

  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.host }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     host: windows-latest, asset: Kartova-win-x64.zip }
          - { rid: win-arm64,   host: windows-latest, asset: Kartova-win-arm64.zip }
          - { rid: linux-x64,   host: ubuntu-latest,  asset: Kartova-linux-x64.tar.gz }
          - { rid: linux-arm64, host: ubuntu-latest,  asset: Kartova-linux-arm64.tar.gz }
          - { rid: osx-x64,     host: macos-latest,   asset: Kartova-osx-x64.tar.gz }
          - { rid: osx-arm64,   host: macos-latest,   asset: Kartova-osx-arm64.tar.gz }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish self-contained
        shell: bash
        run: ./build/publish.sh ${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          case "${{ matrix.rid }}" in
            osx-*)
              # Ship the bundle, not the flat publish directory: Finder will not launch
              # the latter. The executable bit has to survive the archive.
              chmod +x "${{ matrix.rid }}-bundle/Kartova.app/Contents/MacOS/Kartova"
              tar -czf "${{ matrix.asset }}" -C "${{ matrix.rid }}-bundle" Kartova.app
              ;;
            win-*)
              7z a "${{ matrix.asset }}" "./${{ matrix.rid }}/*"
              ;;
            *)
              chmod +x "${{ matrix.rid }}/Kartova"
              tar -czf "${{ matrix.asset }}" -C "${{ matrix.rid }}" .
              ;;
          esac
          ls -la "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Self-contained builds. Nothing to install — download, extract, run.

            | Platform | Asset |
            |---|---|
            | Windows x64 | `Kartova-win-x64.zip` |
            | Windows arm64 | `Kartova-win-arm64.zip` |
            | macOS Apple silicon | `Kartova-osx-arm64.tar.gz` |
            | macOS Intel | `Kartova-osx-x64.tar.gz` |
            | Linux x64 | `Kartova-linux-x64.tar.gz` |
            | Linux arm64 | `Kartova-linux-arm64.tar.gz` |

            macOS builds are unsigned, so the first launch needs right-click then Open.
            Linux builds need `libX11`, `libICE`, `libSM` and `fontconfig`, which every
            desktop install already has.

            Verify downloads against `SHA256SUMS.txt`.
