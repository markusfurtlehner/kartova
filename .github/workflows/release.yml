name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     host: windows-latest }
          - { rid: win-arm64,   host: windows-latest }
          - { rid: linux-x64,   host: ubuntu-latest }
          - { rid: linux-arm64, host: ubuntu-latest }
          - { rid: osx-x64,     host: macos-latest }
          - { rid: osx-arm64,   host: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish self-contained
        shell: bash
        run: ./build/publish.sh ${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          cd artifacts
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            tar -czf "DirStat-${{ matrix.rid }}.tar.gz" -C "${{ matrix.rid }}-bundle" DirStat.app
          elif [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "DirStat-${{ matrix.rid }}.zip" "./${{ matrix.rid }}/*"
          else
            tar -czf "DirStat-${{ matrix.rid }}.tar.gz" -C "${{ matrix.rid }}" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DirStat-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Self-contained builds. Nothing to install — download, extract, run.

            | Platform | Asset |
            |---|---|
            | Windows x64 | `DirStat-win-x64.zip` |
            | Windows arm64 | `DirStat-win-arm64.zip` |
            | macOS Apple silicon | `DirStat-osx-arm64.tar.gz` |
            | macOS Intel | `DirStat-osx-x64.tar.gz` |
            | Linux x64 | `DirStat-linux-x64.tar.gz` |
            | Linux arm64 | `DirStat-linux-arm64.tar.gz` |

            macOS builds are unsigned, so the first launch needs right-click then Open.
            Linux builds need `libX11`, `libICE`, `libSM` and `fontconfig`, which every
            desktop install already has. Verify downloads against `SHA256SUMS.txt`.
